<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فرصتي - فرص العمل</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#222;
}

header{
  background:#0d6efd;
  color:white;
  padding:18px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin-bottom:12px;
}

nav{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

nav button{
  border:0;
  background:white;
  color:#0d6efd;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:1000px;
  margin:25px auto;
  padding:15px;
}

.hero{
  background:white;
  padding:30px 20px;
  border-radius:15px;
  text-align:center;
  margin-bottom:25px;
  box-shadow:0 3px 12px #00000012;
}

.hero h2{
  color:#0d6efd;
  margin-bottom:10px;
}

.primary-btn{
  background:#0d6efd;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
  margin-top:10px;
}

.primary-btn:hover{
  opacity:.9;
}

.jobs{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}

.job-card{
  background:white;
  padding:20px;
  border-radius:13px;
  box-shadow:0 3px 12px #00000012;
}

.job-card h3{
  color:#0d6efd;
  margin-bottom:10px;
}

.job-card p{
  margin:8px 0;
  color:#555;
}

.tag{
  display:inline-block;
  background:#e8f1ff;
  color:#0d6efd;
  padding:5px 9px;
  border-radius:6px;
  font-size:13px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#00000088;
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-content{
  background:white;
  width:100%;
  max-width:550px;
  max-height:90vh;
  overflow:auto;
  padding:25px;
  border-radius:15px;
  position:relative;
}

.close{
  position:absolute;
  left:18px;
  top:10px;
  font-size:30px;
  cursor:pointer;
  color:#777;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  margin-bottom:7px;
  font-weight:bold;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.toast{
  display:none;
  position:fixed;
  bottom:25px;
  right:20px;
  background:#222;
  color:white;
  padding:14px 20px;
  border-radius:9px;
  z-index:200;
}

footer{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:600px){
  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<header>
  <h1>💼 فرصتي</h1>
  <p>منصة فرص العمل الجزائرية</p>

  <nav>
    <button onclick="goHome()">الرئيسية</button>
    <button onclick="openModal('publishModal')">📢 نشر فرصة</button>
    <button onclick="openModal('loginModal')">👤 تسجيل الدخول</button>
  </nav>
</header>

<div class="container">

<section class="hero" id="home">
  <h2>🚀 ابحث عن فرصتك</h2>
  <p>اكتشف فرص العمل المناسبة لك في الجزائر.</p>

  <button class="primary-btn" onclick="showJobs()">
    🔎 مشاهدة فرص العمل
  </button>
</section>

<h2 id="jobsTitle" style="margin-bottom:15px;">
  💼 أحدث فرص العمل
</h2>

<div class="jobs" id="jobsList"></div>

</div>

<!-- نشر فرصة -->

<div class="modal" id="publishModal">
  <div class="modal-content">

    <span class="close" onclick="closeModal('publishModal')">×</span>

    <h2>📢 نشر فرصة عمل</h2>

    <div class="form-grid">

      <div class="form-group">
        <label>اسم الوظيفة</label>
        <input type="text" id="newJobTitle" placeholder="مثال: محاسب">
      </div>

      <div class="form-group">
        <label>اسم الشركة</label>
        <input type="text" id="newCompany" placeholder="اسم الشركة">
      </div>

      <div class="form-group">
        <label>الولاية</label>
        <select id="newLocation">
          <option value="">اختر الولاية</option>
          <option>الجزائر</option>
          <option>بومرداس</option>
          <option>تيبازة</option>
          <option>البليدة</option>
          <option>وهران</option>
          <option>قسنطينة</option>
          <option>سطيف</option>
          <option>عنابة</option>
        </select>
      </div>

      <div class="form-group">
        <label>المجال</label>
        <select id="newCategory">
          <option value="">اختر المجال</option>
          <option>تقنية</option>
          <option>تجارة</option>
          <option>تعليم</option>
          <option>صحة</option>
          <option>نقل</option>
          <option>خدمات</option>
          <option>أخرى</option>
        </select>
      </div>

      <div class="form-group full">
        <label>وصف الوظيفة</label>
        <textarea id="newDescription"
          placeholder="اكتب تفاصيل الوظيفة..."></textarea>
      </div>

      <div class="form-group full">
        <button class="primary-btn" onclick="publishJob()">
          🚀 نشر الفرصة
        </button>
      </div>

    </div>
  </div>
</div>

<!-- تسجيل الدخول -->

<div class="modal" id="loginModal">
  <div class="modal-content">

    <span class="close" onclick="closeModal('loginModal')">×</span>

    <h2>👤 تسجيل الدخول</h2>

    <label>البريد الإلكتروني</label>
    <input type="email" id="email"
      placeholder="example@email.com">

    <br><br>

    <label>كلمة المرور</label>
    <input type="password" id="password"
      placeholder="كلمة المرور">

    <button class="primary-btn" onclick="loginUser()">
      دخول
    </button>

    <p style="margin-top:15px;color:#777;text-align:center;">
      هذه نسخة تجريبية من موقع فرصتي.
    </p>

  </div>
</div>

<!-- التقديم -->

<div class="modal" id="applyModal">
  <div class="modal-content">

    <span class="close" onclick="closeModal('applyModal')">×</span>

    <h2>📩 التقدم للوظيفة</h2>

    <p id="selectedJob"
       style="margin:15px 0;color:#0d6efd;font-weight:bold;">
    </p>

    <label>الاسم الكامل</label>
    <input type="text" id="applicantName"
      placeholder="اكتب اسمك">

    <br><br>

    <label>رقم الهاتف</label>
    <input type="tel" id="applicantPhone"
      placeholder="رقم الهاتف">

    <button class="primary-btn" onclick="sendApplication()">
      إرسال الطلب
    </button>

  </div>
</div>

<div class="toast" id="toast"></div>

<footer>
  © 2026 فرصتي - جميع الحقوق محفوظة
</footer>

<script>

let jobs = [
  {
    title:"محاسب",
    company:"شركة الجزائر",
    location:"الجزائر",
    category:"تجارة",
    description:"مطلوب محاسب للعمل ضمن فريق الشركة."
  },
  {
    title:"مطور مواقع",
    company:"شركة تقنية",
    location:"بومرداس",
    category:"تقنية",
    description:"فرصة عمل لمطور مواقع لديه خبرة في HTML وCSS وJavaScript."
  },
  {
    title:"أستاذ تعليم",
    company:"مؤسسة تعليمية",
    location:"تيبازة",
    category:"تعليم",
    description:"مطلوب أستاذ للعمل في مؤسسة تعليمية."
  }
];

let selectedJobTitle = "";

function renderJobs(){

  const list = document.getElementById("jobsList");

  list.innerHTML = "";

  jobs.forEach(function(job){

    const card = document.createElement("div");

    card.className = "job-card";

    card.innerHTML = `
      <h3>${escapeHTML(job.title)}</h3>

      <p>🏢 ${escapeHTML(job.company)}</p>

      <p>📍 ${escapeHTML(job.location)}</p>

      <span class="tag">
        ${escapeHTML(job.category)}
      </span>

      <p>${escapeHTML(job.description)}</p>

      <button class="primary-btn"
        onclick="openApply('${escapeAttribute(job.title)}')">
        📩 التقدم للوظيفة
      </button>
    `;

    list.appendChild(card);
  });
}

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttribute(text){

  return String(text).replace(/'/g,"\\'");
}

function openModal(id){

  document.getElementById(id).style.display="flex";
}

function closeModal(id){

  document.getElementById(id).style.display="none";
}

function goHome(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function showJobs(){

  document.getElementById("jobsTitle")
    .scrollIntoView({
      behavior:"smooth"
    });
}

function openApply(jobTitle){

  selectedJobTitle = jobTitle;

  document.getElementById("selectedJob").textContent =
    "الوظيفة: " + jobTitle;

  openModal("applyModal");
}

function publishJob(){

  const title =
    document.getElementById("newJobTitle").value.trim();

  const company =
    document.getElementById("newCompany").value.trim();

  const location =
    document.getElementById("newLocation").value;

  const category =
    document.getElementById("newCategory").value;

  const description =
    document.getElementById("newDescription").value.trim();

  if(!title || !company || !location ||
     !category || !description){

    showToast("⚠️ يرجى ملء جميع البيانات");

    return;
  }

  jobs.unshift({
    title:title,
    company:company,
    location:location,
    category:category,
    description:description
  });

  renderJobs();

  document.getElementById("newJobTitle").value="";
  document.getElementById("newCompany").value="";
  document.getElementById("newLocation").value="";
  document.getElementById("newCategory").value="";
  document.getElementById("newDescription").value="";

  closeModal("publishModal");

  showToast("✅ تم نشر فرصة العمل بنجاح");
}

function loginUser(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value.trim();

  if(!email || !password){

    showToast("⚠️ أدخل البريد الإلكتروني وكلمة المرور");

    return;
  }

  closeModal("loginModal");

  showToast("✅ تم تسجيل الدخول بنجاح - نسخة تجريبية");
}

function sendApplication(){

  const name =
    document.getElementById("applicantName").value.trim();

  const phone =
    document.getElementById("applicantPhone").value.trim();

  if(!name || !phone){

    showToast("⚠️ أدخل الاسم ورقم الهاتف");

    return;
  }

  closeModal("applyModal");

  document.getElementById("applicantName").value="";
  document.getElementById("applicantPhone").value="";

  showToast(
    "✅ تم إرسال طلبك للوظيفة: " + selectedJobTitle
  );
}

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.style.display="block";

  setTimeout(function(){

    toast.style.display="none";

  },3000);
}

window.onclick=function(event){

  if(event.target.classList.contains("modal")){

    event.target.style.display="none";
  }
};

renderJobs();

</script>

</body>
   </html>
